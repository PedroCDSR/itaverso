<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: usa a tela toda no iPhone com entalhe; user-scalable=no evita zoom por toque duplo -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#9E9EFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Aladdin · Paula De Marco Espaço de Artes</title>
    <meta
      name="description"
      content="Jogue o Aladdin do Paula De Marco Espaço de Artes e descubra o espetáculo de 20/11 no Teatro do Colégio G9, em Itajubá."
    />
    <link rel="preload" href="/assets/fonts/PressStart2P.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/PatrickHand.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/assets/fonts/PressStart2P.woff2') format('woff2');
        font-display: block;
      }
      @font-face {
        font-family: 'Patrick Hand';
        src: url('/assets/fonts/PatrickHand.woff2') format('woff2');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #9e9eff;
        /* sem seleção de texto, sem menu de toque longo, sem zoom/rolagem por gesto */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }
      #jogo {
        width: 100%;
        height: 100%;
        /* em tela cheia o navegador pinta o fundo de preto; aqui fica lilás */
        background: #9e9eff;
      }
      #jogo canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="jogo"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
