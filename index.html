<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: usa a tela toda no iPhone com entalhe; user-scalable=no evita zoom por toque duplo -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#9E9EFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Aladdin · Paula De Marco Espaço de Artes</title>
    <meta
      name="description"
      content="Jogue o Aladdin do Paula De Marco Espaço de Artes e descubra o espetáculo de 20/11 no Teatro do Colégio G9, em Itajubá."
    />

    <!-- Prévia do link (WhatsApp, Instagram, Facebook). A imagem precisa de endereço completo. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Paula De Marco Espaço de Artes" />
    <meta property="og:title" content="Aladdin · o jogo do espetáculo" />
    <meta
      property="og:description"
      content="Corra por Itajubá, resgate a Tia Paula e garanta seu ingresso! Espetáculo dia 20/11 no Teatro do Colégio G9."
    />
    <meta property="og:url" content="https://aladdin-paulademarco.netlify.app/" />
    <meta property="og:image" content="https://aladdin-paulademarco.netlify.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aladdin, o jogo do espetáculo do Paula De Marco Espaço de Artes" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Ícones e "Adicionar à tela inicial" (abre em tela cheia, deitado) -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Aladdin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preload" href="/assets/fonts/PressStart2P.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/PatrickHand.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/assets/fonts/PressStart2P.woff2') format('woff2');
        font-display: block;
      }
      @font-face {
        font-family: 'Patrick Hand';
        src: url('/assets/fonts/PatrickHand.woff2') format('woff2');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #9e9eff;
        /* sem seleção de texto, sem menu de toque longo, sem zoom/rolagem por gesto */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }
      #jogo {
        width: 100%;
        height: 100%;
        /* em tela cheia (botão da pausa) o navegador pinta o fundo de preto; aqui fica lilás */
        background: #9e9eff;
      }
      #jogo canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="jogo"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
