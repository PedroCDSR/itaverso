<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: usa a tela toda no iPhone com entalhe; user-scalable=no evita zoom por toque duplo -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2B2D5C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>ITAMANIA</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='7' width='22' height='18' rx='7' fill='%23c58a48'/%3E%3Ccircle cx='11' cy='15' r='2'/%3E%3Ccircle cx='21' cy='15' r='2'/%3E%3Crect x='11' y='19' width='10' height='5' rx='2' fill='%23855434'/%3E%3C/svg%3E" />
    <meta name="description" content="ITAMANIA: um jogo de plataforma para celular sobre Itajubá/MG." />
    <link rel="preload" href="assets/fonts/PressStart2P.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/PatrickHand.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('assets/fonts/PressStart2P.woff2') format('woff2');
        font-display: block;
      }
      @font-face {
        font-family: 'Patrick Hand';
        src: url('assets/fonts/PatrickHand.woff2') format('woff2');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #2b2d5c;
        /* sem seleção de texto, sem menu de toque longo, sem zoom/rolagem por gesto */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }
      #jogo {
        width: 100%;
        height: 100%;
        /* em tela cheia (botão da pausa) o navegador pinta o fundo de preto; aqui fica lilás */
        background: #2b2d5c;
      }
      #jogo canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="jogo"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
